name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Restore persistent debug signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is required for installable builds."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Android native and Metro outputs
        uses: actions/cache@v6
        with:
          path: |
            .metro-cache
            node_modules/react-native-worklets/.worklets
            app/.cxx
            app/build/intermediates/cxx
            node_modules/**/.cxx
            node_modules/**/build/intermediates/cxx
          key: ${{ runner.os }}-android-arm64-native-${{ hashFiles('package-lock.json', 'build.gradle.kts', 'app/build.gradle.kts', 'gradle.properties', 'settings.gradle.kts', 'patches/**', 'babel.config.js', 'metro.config.js') }}

      - name: Check TypeScript
        run: node_modules/.bin/tsc --noEmit

      - name: Build debug APK
        run: bash ./scripts/build-debug-ci.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fcc-claude-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
